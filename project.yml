name: Crocus
options:
  bundleIdPrefix: com.rbatmaz69
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: UA98Q7K4JR
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Crocus:
    type: application
    platform: macOS
    sources:
      - path: Crocus
        excludes:
          - "Resources/Info.plist"
          - "Resources/Crocus.entitlements"
    info:
      path: Crocus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Crocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Bilal Batmaz"
        CFBundleURLTypes:
          - CFBundleURLName: com.rbatmaz69.crocus
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - crocus
    entitlements:
      path: Crocus/Resources/Crocus.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbatmaz69.crocus
        PRODUCT_NAME: Crocus
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  CrocusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CrocusTests
    dependencies:
      - target: Crocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbatmaz69.crocus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Crocus.app/Contents/MacOS/Crocus
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Crocus:
    build:
      targets:
        Crocus: all
        CrocusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CrocusTests
